<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cobrinha 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: cabeçalho com placar, palco 3D que ocupa a tela toda, direcional na base (só em toque).
   Visual único e deliberado (mundo diurno de desenho animado), por isso sem variante escura. */
:root {
  --sky-top: #7cc8ff;
  --sky-bot: #e6f8ff;
  --ink: #2b2a4c;
  --panel: #ffffff;
  --apple: #ff5d73;
  --sun: #ffc93c;
  --muted: #5d5c80;
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--sky-bot);
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 600;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 16px;
}
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.9rem;
  line-height: 1;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
h1 span { color: var(--apple); }
.stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 14px;
  background: var(--panel);
  border: 3px solid var(--ink);
  border-radius: 999px;
  box-shadow: 0 3px 0 var(--ink);
}
.pill small {
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.pill b {
  font-family: var(--font-display);
  font-size: 1.3rem;
  font-variant-numeric: tabular-nums;
  min-width: 1.2ch;
  text-align: right;
}
.pill.bump { animation: bump 0.32s ease-out; }
@keyframes bump { 40% { transform: scale(1.14) rotate(-2deg); } }
.btn {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1rem;
  color: var(--ink);
  background: var(--sun);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 6px 16px;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  transition: transform 0.06s, box-shadow 0.06s;
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .pad button:focus-visible { outline: 3px solid var(--apple); outline-offset: 3px; }
.btn.big { font-size: 1.35rem; padding: 10px 30px; background: var(--apple); color: #fff; border-radius: 18px; box-shadow: 0 5px 0 var(--ink); }

#stage {
  position: relative;
  flex: 1;
  min-height: 0;
  border: 4px solid var(--ink);
  border-radius: 24px;
  overflow: hidden;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bot) 70%);
  touch-action: none;
}
#stage canvas { display: block; width: 100%; height: 100%; }
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(43, 42, 76, 0.28);
}
.card {
  box-sizing: border-box;
  width: min(100%, 340px);
  padding: 22px 22px 24px;
  text-align: center;
  background: var(--panel);
  border: 4px solid var(--ink);
  border-radius: 26px;
  box-shadow: 0 7px 0 var(--ink);
  animation: pop 0.4s cubic-bezier(.3, 1.5, .5, 1);
}
@keyframes pop { from { transform: scale(0.7); opacity: 0; } }
.card h2 {
  margin: 0 0 6px;
  font-family: var(--font-display);
  font-size: 2.3rem;
  line-height: 1.05;
  text-wrap: balance;
}
.card p { margin: 0 0 6px; color: var(--muted); font-weight: 800; }
.card .hint { font-size: 0.85rem; margin: 10px 0 16px; font-weight: 600; }
.card .score-line { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); }

.pad { display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 50px); gap: 6px; justify-content: center; }
.pad button {
  font-size: 1.2rem;
  color: var(--ink);
  background: var(--panel);
  border: 3px solid var(--ink);
  border-radius: 14px;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  touch-action: none;
  padding: 0;
}
.pad button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.pad .up { grid-column: 2; grid-row: 1; }
.pad .left { grid-column: 1; grid-row: 2; }
.pad .down { grid-column: 2; grid-row: 2; }
.pad .right { grid-column: 3; grid-row: 2; }
@media (hover: none), (max-width: 700px) { .pad { display: grid; } }
@media (max-width: 480px) { h1 { font-size: 1.5rem; } }
@media (prefers-reduced-motion: reduce) { .card, .pill.bump { animation: none; } }
</style>

<header>
  <h1>Cobrinha <span>3D</span></h1>
  <div class="stats">
    <div class="pill" id="pillScore"><small>Maçãs</small><b id="score">0</b></div>
    <div class="pill"><small>Recorde</small><b id="best">0</b></div>
    <button class="btn" id="pauseBtn" disabled>Pausar</button>
    <button class="btn" id="soundBtn" aria-pressed="true">Som: ligado</button>
  </div>
</header>

<div id="stage">
  <div id="overlay">
    <div class="card">
      <h2 id="ovTitle">Cobrinha 3D</h2>
      <p id="ovText">Coma as maçãs e não bata nas paredes.</p>
      <p class="hint" id="ovHint">Setas, WASD ou deslize na tela</p>
      <button class="btn big" id="ovBtn">Jogar</button>
    </div>
  </div>
</div>

<div class="pad" aria-label="Direcional">
  <button class="up" data-dx="0" data-dy="-1" aria-label="Cima">&#9650;</button>
  <button class="left" data-dx="-1" data-dy="0" aria-label="Esquerda">&#9664;</button>
  <button class="down" data-dx="0" data-dy="1" aria-label="Baixo">&#9660;</button>
  <button class="right" data-dx="1" data-dy="0" aria-label="Direita">&#9654;</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  var N = 15, HALF = (N - 1) / 2, INK = 0x2b2a4c;
  var stage = document.getElementById('stage');
  var el = {
    score: document.getElementById('score'), best: document.getElementById('best'),
    pill: document.getElementById('pillScore'), pause: document.getElementById('pauseBtn'),
    sound: document.getElementById('soundBtn'), overlay: document.getElementById('overlay'),
    title: document.getElementById('ovTitle'), text: document.getElementById('ovText'),
    hint: document.getElementById('ovHint'), btn: document.getElementById('ovBtn')
  };

  /* ---------- three.js base ---------- */
  var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.insertBefore(renderer.domElement, stage.firstChild);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, 1, 0.5, 200);
  var camDir = new THREE.Vector3(0, 0.8, 0.6).normalize();
  var camDist = 22;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8fd16a, 0.95));
  var sun = new THREE.DirectionalLight(0xffffff, 0.75);
  sun.position.set(-7, 15, 9);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.left = -14; sun.shadow.camera.right = 14;
  sun.shadow.camera.top = 14; sun.shadow.camera.bottom = -14;
  sun.shadow.camera.near = 1; sun.shadow.camera.far = 45;
  sun.shadow.bias = -0.0006;
  scene.add(sun);

  var grad = new THREE.DataTexture(new Uint8Array([110, 190, 255]), 3, 1, THREE.LuminanceFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter;
  grad.needsUpdate = true;
  function toon(color) { return new THREE.MeshToonMaterial({ color: color, gradientMap: grad }); }
  var outlineMat = new THREE.MeshBasicMaterial({ color: INK, side: THREE.BackSide });
  function outlined(mesh, s) {
    var o = new THREE.Mesh(mesh.geometry, outlineMat);
    o.scale.setScalar(s);
    mesh.add(o);
    return mesh;
  }
  var sphereGeo = new THREE.SphereGeometry(1, 28, 20);
  var boxGeo = new THREE.BoxGeometry(1, 1, 1);
  function sphere(r, mat, x, y, z, sx, sy, sz) {
    var m = new THREE.Mesh(sphereGeo, mat);
    m.scale.set(r * (sx || 1), r * (sy || 1), r * (sz || 1));
    m.position.set(x || 0, y || 0, z || 0);
    return m;
  }

  /* ---------- cenário ---------- */
  var rngSeed = 7;
  function rnd() { rngSeed |= 0; rngSeed = rngSeed + 0x6D2B79F5 | 0; var t = Math.imul(rngSeed ^ rngSeed >>> 15, 1 | rngSeed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

  var g1 = toon(0x86e05a), g2 = toon(0x74cf4a);
  var tileGeo = new THREE.BoxGeometry(1, 0.3, 1);
  for (var i = 0; i < N; i++) {
    for (var j = 0; j < N; j++) {
      var tile = new THREE.Mesh(tileGeo, (i + j) % 2 ? g1 : g2);
      tile.position.set(i - HALF, -0.15, j - HALF);
      tile.receiveShadow = true;
      scene.add(tile);
    }
  }
  var dirtMat = toon(0x9a643f), woodMat = toon(0xd49a62);
  var base = new THREE.Mesh(boxGeo, dirtMat);
  base.scale.set(N + 0.8, 0.9, N + 0.8); base.position.y = -0.75; base.receiveShadow = true;
  scene.add(base);
  var ground = new THREE.Mesh(new THREE.PlaneGeometry(220, 220), toon(0xa6e87c));
  ground.rotation.x = -Math.PI / 2; ground.position.y = -1.2; ground.receiveShadow = true;
  scene.add(ground);
  [[N + 0.8, 0.4, 0, N / 2 + 0.2], [N + 0.8, 0.4, 0, -(N / 2 + 0.2)]].forEach(function (w) {
    var m = new THREE.Mesh(boxGeo, woodMat); m.scale.set(w[0], 0.5, w[1]); m.position.set(w[2], 0.05, w[3]);
    m.castShadow = m.receiveShadow = true; scene.add(m);
  });
  [N / 2 + 0.2, -(N / 2 + 0.2)].forEach(function (x) {
    var m = new THREE.Mesh(boxGeo, woodMat); m.scale.set(0.4, 0.5, N); m.position.set(x, 0.05, 0);
    m.castShadow = m.receiveShadow = true; scene.add(m);
  });

  var trunkMat = toon(0x9b6a3c), leafA = toon(0x3fb55a), leafB = toon(0x58cc6b);
  function tree(x, z, s) {
    var g = new THREE.Group();
    var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.34, 1.5, 12), trunkMat);
    trunk.position.y = 0.75; outlined(trunk, 1.12); g.add(trunk);
    g.add(outlined(sphere(1.15, leafA, 0, 2.1, 0), 1.07));
    g.add(outlined(sphere(0.85, leafB, 0.35, 3.0, 0.1), 1.08));
    g.position.set(x, -1.2, z); g.scale.setScalar(s);
    g.traverse(function (o) { if (o.isMesh && o.material !== outlineMat) o.castShadow = true; });
    scene.add(g);
  }
  function bush(x, z, s) {
    var g = new THREE.Group();
    g.add(outlined(sphere(0.55, leafA, 0, 0.45, 0), 1.1));
    g.add(outlined(sphere(0.42, leafB, 0.55, 0.32, 0.1), 1.1));
    g.add(outlined(sphere(0.4, leafB, -0.5, 0.3, -0.1), 1.1));
    g.position.set(x, -1.2, z); g.scale.setScalar(s);
    g.traverse(function (o) { if (o.isMesh && o.material !== outlineMat) o.castShadow = true; });
    scene.add(g);
  }
  var placed = 0, guard = 0;
  while (placed < 22 && guard++ < 400) {
    var ang = rnd() * Math.PI * 2, rad = 9.5 + rnd() * 6;
    var px = Math.cos(ang) * rad, pz = Math.sin(ang) * rad;
    if (Math.abs(px) < 9 && Math.abs(pz) < 9) continue;
    if (pz > 6) bush(px, pz, 0.8 + rnd() * 0.5); else tree(px, pz, 0.8 + rnd() * 0.5);
    placed++;
  }
  var petals = [0xff8fb1, 0xffe066, 0xffffff, 0xff9f6e].map(function (c) { return new THREE.MeshBasicMaterial({ color: c }); });
  for (var f = 0; f < 40; f++) {
    var fa = rnd() * Math.PI * 2, fr = 8.8 + rnd() * 7;
    var fx = Math.cos(fa) * fr, fz = Math.sin(fa) * fr;
    if (Math.abs(fx) < 8.6 && Math.abs(fz) < 8.6) continue;
    scene.add(sphere(0.13, petals[f % 4], fx, -1.05, fz));
  }
  var clouds = [];
  var cloudMat = new THREE.MeshToonMaterial({ color: 0xffffff, gradientMap: grad });
  for (var c = 0; c < 5; c++) {
    var cg = new THREE.Group();
    cg.add(sphere(1.4, cloudMat, 0, 0, 0)); cg.add(sphere(1.1, cloudMat, 1.5, -0.2, 0.2));
    cg.add(sphere(1.0, cloudMat, -1.4, -0.3, 0)); cg.add(sphere(0.8, cloudMat, 0.4, 0.5, 0.6));
    cg.scale.set(1.2, 0.7, 1);
    cg.position.set(-22 + c * 11, 13 + (c % 2) * 2, -12 + (c % 3) * 3);
    scene.add(cg); clouds.push(cg);
  }

  /* ---------- cobra ---------- */
  var matA = toon(0x8e5bff), matB = toon(0xb28cff);
  var head = new THREE.Group();
  var headMat = toon(0x7a47f0);
  var headBall = sphere(1, headMat, 0, 0, 0, 0.58, 0.52, 0.58);
  outlined(headBall, 1.07); headBall.castShadow = true; head.add(headBall);
  var white = toon(0xffffff), black = new THREE.MeshBasicMaterial({ color: INK });
  var pink = toon(0xff9fc0), shine = new THREE.MeshBasicMaterial({ color: 0xffffff });
  [-1, 1].forEach(function (s) {
    head.add(outlined(sphere(0.18, white, s * 0.22, 0.24, 0.38), 1.12));
    head.add(sphere(0.1, black, s * 0.22, 0.25, 0.53));
    head.add(sphere(0.035, shine, s * 0.22 + 0.03, 0.29, 0.6));
    head.add(sphere(0.085, pink, s * 0.38, -0.02, 0.34, 1, 0.7, 0.5));
  });
  var tongue = new THREE.Mesh(boxGeo, toon(0xff4d6a));
  tongue.scale.set(0.07, 0.03, 0.3); tongue.position.set(0, -0.1, 0.7); head.add(tongue);
  var tongueFork = [-1, 1].map(function (s) {
    var m = new THREE.Mesh(boxGeo, tongue.material); m.scale.set(0.05, 0.03, 0.12);
    m.position.set(s * 0.05, -0.1, 0.9); m.rotation.y = s * 0.5; head.add(m); return m;
  });
  scene.add(head);

  var dizzy = new THREE.Group();
  var starMat = new THREE.MeshBasicMaterial({ color: 0xffd23c });
  for (var d = 0; d < 3; d++) {
    var st = new THREE.Mesh(new THREE.OctahedronGeometry(0.16), starMat);
    st.userData.a = d * Math.PI * 2 / 3; dizzy.add(st);
  }
  dizzy.visible = false; scene.add(dizzy);

  var bodies = [];
  function getBody(i) {
    while (bodies.length <= i) {
      var k = bodies.length;
      var m = outlined(new THREE.Mesh(sphereGeo, k % 2 ? matA : matB), 1.09);
      m.castShadow = true; scene.add(m); bodies.push(m);
    }
    return bodies[i];
  }

  /* ---------- maçã ---------- */
  var apple = new THREE.Group(), appleBody;
  (function () {
    appleBody = outlined(sphere(1, toon(0xff4560), 0, 0, 0, 0.42, 0.4, 0.42), 1.1);
    appleBody.castShadow = true; apple.add(appleBody);
    apple.add(sphere(0.07, shine, -0.15, 0.17, 0.2));
    var stem = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.22, 8), trunkMat);
    stem.position.y = 0.42; apple.add(stem);
    var leaf = sphere(1, toon(0x3fd16a), 0.12, 0.46, 0, 0.16, 0.04, 0.09);
    leaf.rotation.z = 0.5; apple.add(leaf);
    scene.add(apple);
  })();

  /* ---------- estado ---------- */
  var segs, from, dir, queue, appleCell, score = 0, best = 0, grown = -1;
  var state = 'ready', acc = 0, appleAge = 0, headAngle = Math.PI / 2, deadAt = 0;
  var particles = [], time = 0;
  try { best = parseInt(localStorage.getItem('cobrinha3d-best'), 10) || 0; } catch (e) { best = 0; }
  el.best.textContent = best;

  function interval() { return Math.max(0.085, 0.18 - score * 0.0035); }
  function copy(a) { return a.map(function (s) { return { x: s.x, y: s.y }; }); }

  function spawnApple() {
    var free = [];
    for (var x = 0; x < N; x++) for (var y = 0; y < N; y++) {
      if (!segs.some(function (s) { return s.x === x && s.y === y; })) free.push({ x: x, y: y });
    }
    if (!free.length) { appleCell = null; apple.visible = false; return false; }
    appleCell = free[Math.floor(Math.random() * free.length)];
    appleAge = 0; apple.visible = true;
    return true;
  }

  function reset() {
    segs = [{ x: 7, y: 7 }, { x: 6, y: 7 }, { x: 5, y: 7 }];
    from = copy(segs); dir = { x: 1, y: 0 }; queue = []; score = 0; grown = -1; acc = 0;
    headAngle = Math.PI / 2;
    el.score.textContent = '0';
    matA.emissive.setHex(0x000000); matB.emissive.setHex(0x000000); headMat.emissive.setHex(0x000000);
    dizzy.visible = false;
    particles.forEach(function (p) { scene.remove(p.mesh); p.mesh.material.dispose(); });
    particles = [];
    spawnApple();
  }

  /* ---------- som ---------- */
  var actx = null, soundOn = true;
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function beep(freq, dur, type, vol, delay, slideTo) {
    if (!actx || !soundOn) return;
    try {
      var t0 = actx.currentTime + (delay || 0), o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'triangle';
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(vol || 0.08, t0);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) { /* sem áudio */ }
  }

  /* ---------- efeitos ---------- */
  function burst(cell) {
    var cols = [0xff4560, 0xffd23c, 0xff8a5c, 0xffffff];
    for (var i = 0; i < 12; i++) {
      var m = sphere(0.09 + Math.random() * 0.06, new THREE.MeshBasicMaterial({ color: cols[i % 4] }), cell.x - HALF, 0.5, cell.y - HALF);
      var a = Math.random() * Math.PI * 2, sp = 2 + Math.random() * 2.5;
      scene.add(m);
      particles.push({ mesh: m, vx: Math.cos(a) * sp, vy: 3 + Math.random() * 3, vz: Math.sin(a) * sp, life: 0.7 });
    }
  }

  /* ---------- lógica ---------- */
  function step() {
    if (queue.length) {
      var n = queue.shift();
      if (!(n.x === -dir.x && n.y === -dir.y)) dir = n;
    }
    var h = segs[0], nx = h.x + dir.x, ny = h.y + dir.y;
    var ate = appleCell && nx === appleCell.x && ny === appleCell.y;
    var body = ate ? segs : segs.slice(0, -1);
    if (nx < 0 || ny < 0 || nx >= N || ny >= N || body.some(function (s) { return s.x === nx && s.y === ny; })) { die(); return; }
    var old = copy(segs);
    var ns = [{ x: nx, y: ny }].concat(copy(old));
    if (!ate) ns.pop();
    from = ns.map(function (s, i) { return old[i] ? { x: old[i].x, y: old[i].y } : { x: s.x, y: s.y }; });
    segs = ns; grown = -1;
    if (ate) {
      score++; grown = segs.length - 1;
      burst(appleCell);
      el.score.textContent = score;
      el.pill.classList.remove('bump'); void el.pill.offsetWidth; el.pill.classList.add('bump');
      beep(520, 0.09, 'triangle', 0.09); beep(780, 0.13, 'triangle', 0.09, 0.07);
      if (!spawnApple()) { win(); }
    }
  }

  function die() {
    state = 'dead'; from = copy(segs); grown = -1; deadAt = time;
    matA.emissive.setHex(0x661122); matB.emissive.setHex(0x661122); headMat.emissive.setHex(0x661122);
    dizzy.visible = true;
    beep(330, 0.45, 'sawtooth', 0.07, 0, 90);
    el.pause.disabled = true;
    var isBest = score > best;
    if (isBest) {
      best = score; el.best.textContent = best;
      try { localStorage.setItem('cobrinha3d-best', String(best)); } catch (e) { /* ignora */ }
    }
    setTimeout(function () { if (state === 'dead') showOverlay('dead', isBest); }, 950);
  }

  function win() {
    state = 'dead'; from = copy(segs); el.pause.disabled = true;
    if (score > best) { best = score; el.best.textContent = best; try { localStorage.setItem('cobrinha3d-best', String(best)); } catch (e) { /* ignora */ } }
    beep(660, 0.12, 'triangle', 0.09); beep(880, 0.12, 'triangle', 0.09, 0.1); beep(1100, 0.2, 'triangle', 0.09, 0.2);
    setTimeout(function () { showOverlay('win'); }, 600);
  }

  function showOverlay(kind, isBest) {
    el.overlay.hidden = false;
    if (kind === 'ready') {
      el.title.textContent = 'Cobrinha 3D';
      el.text.textContent = 'Coma as maçãs e não bata nas paredes.';
      el.hint.textContent = 'Setas, WASD ou deslize na tela'; el.hint.hidden = false;
      el.btn.textContent = 'Jogar';
    } else if (kind === 'pause') {
      el.title.textContent = 'Pausado';
      el.text.textContent = 'A cobrinha está descansando.';
      el.hint.textContent = 'Espaço também continua o jogo'; el.hint.hidden = false;
      el.btn.textContent = 'Continuar';
    } else if (kind === 'win') {
      el.title.textContent = 'Você zerou!';
      el.text.textContent = 'O tabuleiro inteiro é da cobrinha: ' + score + ' maçãs.';
      el.hint.hidden = true; el.btn.textContent = 'Jogar de novo';
    } else {
      el.title.textContent = 'Ops, bateu!';
      el.text.textContent = 'Você comeu ' + score + (score === 1 ? ' maçã.' : ' maçãs.') + (isBest ? ' Novo recorde!' : ' Recorde: ' + best + '.');
      el.hint.hidden = true; el.btn.textContent = 'Jogar de novo';
    }
    el.btn.focus({ preventScroll: true });
  }

  function start() {
    ensureAudio();
    reset(); state = 'play';
    el.overlay.hidden = true; el.pause.disabled = false; el.pause.textContent = 'Pausar';
  }
  function togglePause() {
    if (state === 'play') { state = 'pause'; el.pause.textContent = 'Continuar'; showOverlay('pause'); }
    else if (state === 'pause') { state = 'play'; el.pause.textContent = 'Pausar'; el.overlay.hidden = true; }
  }
  function turn(dx, dy) {
    if (state === 'ready') start();
    if (state !== 'play') return;
    var last = queue.length ? queue[queue.length - 1] : dir;
    if ((dx === -last.x && dy === -last.y) || (dx === last.x && dy === last.y)) return;
    if (queue.length < 2) queue.push({ x: dx, y: dy });
  }

  /* ---------- controles ---------- */
  var keys = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
  window.addEventListener('keydown', function (e) {
    var k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (keys[k]) { e.preventDefault(); turn(keys[k][0], keys[k][1]); return; }
    if (k === ' ' || k === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      if (state === 'ready' || state === 'dead') start(); else togglePause();
    } else if (k === 'p' || k === 'P') togglePause();
  });
  el.btn.addEventListener('click', function () { if (state === 'pause') togglePause(); else start(); });
  el.pause.addEventListener('click', togglePause);
  el.sound.addEventListener('click', function () {
    soundOn = !soundOn;
    el.sound.textContent = 'Som: ' + (soundOn ? 'ligado' : 'desligado');
    el.sound.setAttribute('aria-pressed', String(soundOn));
    if (soundOn) ensureAudio();
  });
  document.querySelectorAll('.pad button').forEach(function (b) {
    b.addEventListener('pointerdown', function (e) { e.preventDefault(); turn(+b.dataset.dx, +b.dataset.dy); });
  });
  var sw = null;
  stage.addEventListener('pointerdown', function (e) { if (e.target.closest('button')) return; sw = { x: e.clientX, y: e.clientY }; });
  stage.addEventListener('pointermove', function (e) {
    if (!sw || state !== 'play') return;
    var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 26) return;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
    sw = { x: e.clientX, y: e.clientY };
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (n) { stage.addEventListener(n, function () { sw = null; }); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && state === 'play') togglePause(); });

  /* ---------- render ---------- */
  function resize() {
    var w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camDist = Math.max(21, 23.5 / camera.aspect);
    camera.updateProjectionMatrix();
  }
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener('resize', resize);
  resize();

  function lerp(a, b, t) { return a + (b - a) * t; }
  function angDelta(a, b) {
    var d = (b - a) % (Math.PI * 2);
    if (d > Math.PI) d -= Math.PI * 2;
    if (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
  function easeOutBack(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  function segRadius(i, L) {
    if (i === 0) return 0.55;
    var k = i - (L - 4);
    return Math.max(0.26, 0.48 - (k > 0 ? k * 0.06 : 0));
  }

  var last = performance.now();
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
    var iv = interval();
    if (state === 'play') {
      acc += dt;
      while (acc >= iv && state === 'play') { acc -= iv; step(); }
    }
    var t = (state === 'play' || state === 'pause') ? Math.min(1, acc / iv) : 0;
    var L = segs.length, moving = state === 'play' || state === 'pause';

    for (var i = 0; i < L; i++) {
      var x = lerp(from[i].x, segs[i].x, t) - HALF, z = lerp(from[i].y, segs[i].y, t) - HALF;
      var r = segRadius(i, L);
      if (i === grown) r *= Math.max(0.05, t);
      var bob = state === 'dead' ? 0 : Math.sin(time * 9 - i * 0.7) * 0.035;
      if (i === 0) {
        head.position.set(x, 0.52 + bob, z);
        if (state === 'dead') head.position.x += Math.sin(time * 55) * 0.03 * Math.max(0, 1 - (time - deadAt));
      } else {
        var b = getBody(i);
        b.visible = true; b.scale.setScalar(r); b.position.set(x, r + bob, z);
      }
    }
    for (var q = L; q < bodies.length; q++) bodies[q].visible = false;
    if (moving) headAngle += angDelta(headAngle, Math.atan2(dir.x, dir.y)) * Math.min(1, dt * 18);
    head.rotation.y = headAngle;
    head.rotation.z = state === 'dead' ? Math.sin(time * 4) * 0.12 : Math.sin(time * 6) * 0.04;
    var flick = Math.max(0, Math.sin(time * 5.5)) * 0.35;
    tongue.scale.z = 0.3 + flick * 0.4; tongue.position.z = 0.7 + flick * 0.2;
    tongueFork.forEach(function (m) { m.position.z = 0.9 + flick * 0.4; });
    tongue.visible = tongueFork[0].visible = tongueFork[1].visible = state !== 'dead';

    if (dizzy.visible) {
      dizzy.position.set(head.position.x, head.position.y + 0.95, head.position.z);
      dizzy.children.forEach(function (s) {
        var a = s.userData.a + time * 4;
        s.position.set(Math.cos(a) * 0.5, Math.sin(a * 2) * 0.05, Math.sin(a) * 0.5); s.rotation.y = a * 2;
      });
    }

    if (appleCell) {
      appleAge += dt;
      var pop = Math.min(1, appleAge / 0.35), sc = pop < 1 ? easeOutBack(pop) : 1;
      apple.position.set(appleCell.x - HALF, 0.42 + Math.sin(time * 3) * 0.06, appleCell.y - HALF);
      apple.rotation.y = time * 1.4; apple.scale.setScalar(Math.max(0.01, sc));
    }

    for (var p = particles.length - 1; p >= 0; p--) {
      var pt = particles[p]; pt.life -= dt; pt.vy -= 14 * dt;
      pt.mesh.position.x += pt.vx * dt; pt.mesh.position.y += pt.vy * dt; pt.mesh.position.z += pt.vz * dt;
      pt.mesh.scale.multiplyScalar(0.95);
      if (pt.life <= 0 || pt.mesh.position.y < -1) {
        scene.remove(pt.mesh); pt.mesh.material.dispose(); particles.splice(p, 1);
      }
    }

    clouds.forEach(function (c) { c.position.x += dt * 0.6; if (c.position.x > 28) c.position.x = -28; });

    var sway = Math.sin(time * 0.5) * 0.4;
    var shake = state === 'dead' ? Math.max(0, 0.6 - (time - deadAt)) * 0.5 : 0;
    camera.position.set(camDir.x * camDist + sway + (shake ? Math.sin(time * 70) * shake * 0.3 : 0), camDir.y * camDist + (shake ? Math.cos(time * 63) * shake * 0.3 : 0), camDir.z * camDist);
    camera.lookAt(0, -0.5, 0.6);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }

  reset();
  showOverlay('ready');
  requestAnimationFrame(frame);
})();
</script>

</body></html>
